<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SultiAI - Bisaya Language & Communication Hub</title>
    <meta name="description" content="An AI-powered Bisaya/Cebuano language-learning and communication platform for non-native speakers, featuring Whisper speech recognition, BERT-based NLP intent analysis, and structured conversational roleplay." />
    <meta property="og:title" content="SultiAI - Bisaya Language & Communication Hub" />
    <meta property="og:description" content="An AI-powered Bisaya/Cebuano language-learning and communication platform for non-native speakers, featuring Whisper speech recognition, BERT-based NLP intent analysis, and structured conversational roleplay." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F9FA" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('sultiai_theme_preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-app text-ink font-sans antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
